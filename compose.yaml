# Chạy toàn bộ hệ thống: docker compose up --build   (cần tệp .env, xem .env.example)
services:
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-VTPH_Coffee}
      MYSQL_USER: ${DB_USER:-vtph}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Đặt DB_ROOT_PASSWORD trong .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: db
      DB_NAME: ${DB_NAME:-VTPH_Coffee}
      DB_USER: ${DB_USER:-vtph}
      DB_PASSWORD: ${DB_PASSWORD}
      LEGACY_DEMO_HASH: ${LEGACY_DEMO_HASH:-false}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  dbdata:
