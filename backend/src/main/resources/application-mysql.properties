# Profile "mysql": nối MySQL 8.4 và để Flyway tạo/cập nhật lược đồ.
spring.autoconfigure.exclude=
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:VTPH_Coffee}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:vtph}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
# Dữ liệu mẫu (db/seed) chỉ nạp ở môi trường phát triển: đặt FLYWAY_LOCATIONS=classpath:db/migration khi triển khai thật.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
