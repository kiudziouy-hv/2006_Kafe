# ---------------------------------------------------------------------
# Cấu hình mặc định: chạy KHÔNG cần cơ sở dữ liệu (dữ liệu giả lập trong bộ nhớ).
# Chạy với MySQL: bật profile "mysql" (SPRING_PROFILES_ACTIVE=mysql), xem application-mysql.properties.
# Mật khẩu và khóa bí mật KHÔNG ghi ở đây: dùng biến môi trường.
# ---------------------------------------------------------------------
spring.application.name=vtph-coffee
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=VTPHSESSION

# Nguồn được phép gọi API từ trình duyệt (giao diện React chạy ở Vite)
vtph.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Mặc định loại các tự cấu hình cần cơ sở dữ liệu; profile "mysql" bật lại
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Chấp nhận băm SHA-256 của dữ liệu mẫu (03_seed_master.sql) và tự nâng lên bcrypt. CHỈ bật ở môi trường phát triển.
vtph.auth.legacy-demo-hash=${LEGACY_DEMO_HASH:false}

# Ảnh món tải lên (thư mục tương đối so với nơi chạy backend)
vtph.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
